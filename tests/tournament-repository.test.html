<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tournament Repository Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .pass, .summary--pass { color: #4ec9b0; } .fail, .summary--fail { color: #f44747; }
  </style>
</head>
<body>
  <h1>Tournament Repository — Test Suite</h1>
  <div id="results"></div>
  <script src="../js/tournament.js"></script>
  <script src="../js/tournament-format.js"></script>
  <script src="../js/tournament-repository.js"></script>
  <script>
    (async function () {
      'use strict';
      const out = document.getElementById('results');
      let passed = 0;
      let failed = 0;
      function assert(condition, name, detail) {
        const item = document.createElement('p');
        item.className = condition ? 'pass' : 'fail';
        item.textContent = (condition ? '\u2713 ' : '\u2717 ') + name + (detail ? ' — ' + detail : '');
        out.appendChild(item);
        condition ? passed++ : failed++;
      }
      function tournamentFixture() {
        const players = [
          { id: 'p1', name: 'A' }, { id: 'p2', name: 'B' },
          { id: 'p3', name: 'C' }, { id: 'p4', name: 'D' },
        ];
        const teams = [
          { id: 't0', name: 'A & B', players: players.slice(0, 2), player1: players[0], player2: players[1] },
          { id: 't1', name: 'C & D', players: players.slice(2), player1: players[2], player2: players[3] },
        ];
        const groups = [{ id: 'A', teams }];
        return { players, teams, groups, matches: generateMatches(groups) };
      }
      try {
        const repo = createInMemoryTournamentRepository({ uid: 'owner-1', now: () => 1000 });
        const methods = ['createSession', 'watchSession', 'requestAccess', 'setAccess', 'saveResult', 'removeSession'];
        assert(methods.every(name => typeof repo[name] === 'function'), 'repository exposes the six-method interface');
        const created = await repo.createSession(tournamentFixture());
        let snapshot;
        const unsubscribe = repo.watchSession(created.sessionId, value => { snapshot = value; });
        assert(typeof unsubscribe === 'function', 'watchSession returns an unsubscribe function');
        assert(snapshot.schemaVersion === 2 && snapshot.legacy === false, 'createSession exposes a schema-v2 snapshot');
        assert(snapshot.tournament.matches.every(match => match.status === 'pending' && match.revision === 0),
          'v2 projection supplies Pending revision-zero results');
        const firstId = snapshot.tournament.matches[0].id;
        const beforeOther = JSON.stringify(snapshot.tournament.matches[1]);
        const saved = await repo.saveResult(created.sessionId, {
          matchId: firstId,
          score1: 21,
          score2: 18,
          status: 'finished',
          expectedRevision: 0,
        });
        assert(saved.status === 'synced' && saved.result.revision === 1, 'saveResult confirms one synchronized result revision');
        assert(snapshot.tournament.matches[0].status === 'finished' && snapshot.tournament.matches[0].played,
          'v2 result is joined into the addressed match');
        assert(JSON.stringify(snapshot.tournament.matches[1]) === beforeOther,
          'v2 result save leaves every other match unchanged');
        unsubscribe();
        const legacyState = tournamentFixture();
        legacyState.matches = recordMatchScore(legacyState.matches, legacyState.matches[0].id, 21, 17);
        const legacyRepo = createInMemoryTournamentRepository({
          uid: 'viewer-1',
          sessions: { legacy: { state: legacyState, ownerUid: 'old-owner' } },
        });
        let legacySnapshot;
        legacyRepo.watchSession('legacy', value => { legacySnapshot = value; });
        assert(legacySnapshot.schemaVersion === 1 && legacySnapshot.legacy === true, 'v1 codec recognizes a legacy state wrapper');
        assert(legacySnapshot.tournament.matches[0].score1 === 21 && legacySnapshot.tournament.matches[0].played,
          'v1 codec preserves readable teams, matches, and scores');
        const legacyStandings = calculateStandings(legacySnapshot.tournament.groups, legacySnapshot.tournament.matches);
        assert(legacyStandings.get('A')[0].points === 3,
          'v1 codec preserves readable standings');
        const denied = await legacyRepo.saveResult('legacy', {
          matchId: legacySnapshot.tournament.matches[0].id,
          score1: 21,
          score2: 19,
          status: 'finished',
          expectedRevision: 1,
        });
        assert(denied.status === 'denied' && denied.reason === 'legacy-read-only', 'v1 sessions remain read-only');
        let futureSnapshot;
        createInMemoryTournamentRepository({ sessions: { future: { schemaVersion: 99 } } }).watchSession('future', value => { futureSnapshot = value; });
        assert(futureSnapshot.error === 'unsupported-schema' && !futureSnapshot.tournament, 'future schemas fail closed');

        const runtime = { uid: 'owner-2', authState: 'ready', connection: 'online' };
        const outcomeRepo = createInMemoryTournamentRepository({ runtime, now: () => 2000 });
        const outcomeCreated = await outcomeRepo.createSession(tournamentFixture());
        let confirmed;
        outcomeRepo.watchSession(outcomeCreated.sessionId, value => { confirmed = value; });
        const outcomeMatch = confirmed.tournament.matches[0];
        await outcomeRepo.saveResult(outcomeCreated.sessionId, { matchId: outcomeMatch.id, score1: 21, score2: 18, status: 'finished', expectedRevision: 0 });
        const confirmedJSON = JSON.stringify(confirmed.tournament.matches[0]);
        const conflict = await outcomeRepo.saveResult(outcomeCreated.sessionId, { matchId: outcomeMatch.id, score1: 21, score2: 19, status: 'finished', expectedRevision: 0 });
        assert(conflict.status === 'conflict' && conflict.current.revision === 1,
          'stale saves return conflict with the current result');
        assert(JSON.stringify(confirmed.tournament.matches[0]) === confirmedJSON,
          'conflict preserves the last confirmed result');
        const invalid = await outcomeRepo.saveResult(outcomeCreated.sessionId, { matchId: outcomeMatch.id, score1: -1, score2: 18, status: 'finished', expectedRevision: 1 });
        assert(invalid.status === 'invalid' && JSON.stringify(confirmed.tournament.matches[0]) === confirmedJSON,
          'invalid saves preserve the last confirmed result');
        runtime.connection = 'offline';
        const offline = await outcomeRepo.saveResult(outcomeCreated.sessionId, {
          matchId: outcomeMatch.id, score1: 21, score2: 19, status: 'finished', expectedRevision: 1,
        });
        assert(offline.status === 'offline' && JSON.stringify(confirmed.tournament.matches[0]) === confirmedJSON,
          'offline saves remain unsynced and preserve confirmation');
        runtime.connection = 'online'; runtime.authState = 'pending';
        let pendingSnapshot;
        outcomeRepo.watchSession(outcomeCreated.sessionId, value => { pendingSnapshot = value; });
        const pending = await outcomeRepo.saveResult(outcomeCreated.sessionId, {
          matchId: outcomeMatch.id, score1: 21, score2: 19, status: 'finished', expectedRevision: 1,
        });
        assert(pendingSnapshot.authState === 'pending' && pending.status === 'denied',
          'authentication pending keeps editing denied while results remain readable');
        runtime.authState = 'ready'; runtime.uid = 'replacement-device';
        let replacementSnapshot;
        outcomeRepo.watchSession(outcomeCreated.sessionId, value => { replacementSnapshot = value; });
        const identityLost = await outcomeRepo.saveResult(outcomeCreated.sessionId, {
          matchId: outcomeMatch.id, score1: 21, score2: 19, status: 'finished', expectedRevision: 1,
        });
        assert(replacementSnapshot.role === 'spectator' && replacementSnapshot.accessStatus === null && identityLost.status === 'denied',
          'identity loss requires the replacement device to request access again');
        assert(typeof createFirebaseTournamentRepository === 'function',
          'exposes the Firebase adapter factory');

        // Schema v3 (format sessions) — REQ-FMT-30..32
        const formatFixture = tournamentFixture();
        formatFixture.format = {
          version: 1, preset: 'groupsFinal',
          stagesById: {
            group: { id: 'group', kind: 'roundRobin', order: 1, pointsTo: 21, overtime: false },
            final: { id: 'final', kind: 'knockout', order: 2, pointsTo: 15, overtime: false, pairs: [['slot:A1', 'slot:A2']] },
          },
        };
        formatFixture.matches = generateStageMatches(formatFixture.format, formatFixture.groups);
        const formatRepo = createInMemoryTournamentRepository({ uid: 'owner-3', now: () => 3000 });
        const formatCreated = await formatRepo.createSession(formatFixture);
        let formatSnapshot;
        formatRepo.watchSession(formatCreated.sessionId, value => { formatSnapshot = value; });
        assert(formatSnapshot.schemaVersion === 3 && formatSnapshot.legacy === false,
          'a tournament with a format creates a schema-v3 session');
        assert(formatSnapshot.tournament.format && formatSnapshot.tournament.format.version === 1 &&
          formatSnapshot.tournament.format.preset === 'groupsFinal',
          'v3 round-trip decodes the format node (version/preset)');
        assert(formatSnapshot.tournament.format.stagesById.final.pointsTo === 15 &&
          formatSnapshot.tournament.format.stagesById.final.overtime === false,
          'v3 round-trip preserves per-stage pointsTo/overtime');
        assert(formatSnapshot.tournament.format.stagesById.final.pairs === undefined,
          'the persisted format never stores authoring-time pairs (D3)');
        const knockoutMatch = formatSnapshot.tournament.matches.filter(m => m.id.indexOf('k-') === 0)[0];
        assert(knockoutMatch && knockoutMatch.team1Id === 'slot:A1' && knockoutMatch.team2Id === 'slot:A2',
          'v3 round-trip preserves knockout slot descriptors');
        assert(knockoutMatch.score1 === null && knockoutMatch.score2 === null && knockoutMatch.revision === 0 &&
          knockoutMatch.status === 'pending' && knockoutMatch.played === false,
          'a pre-created knockout match carries only its own local-only null result fields, never an undefined one');
        assert(formatSnapshot.tournament.matches.every(m => typeof m.stageId === 'string'),
          'every v3 match carries a stageId');
        const formatAccess = await formatRepo.requestAccess(formatCreated.sessionId, 'Court three');
        assert(formatAccess.status === 'requested', 'requestAccess accepts a schema-v3 session');
        let malformedSnapshot;
        createInMemoryTournamentRepository({
          sessions: { v3bad: { schemaVersion: 3, ownerUid: 'owner', structure: { playersById: {}, teamsById: {}, groupsById: {}, matchesById: {} } } },
        }).watchSession('v3bad', value => { malformedSnapshot = value; });
        assert(malformedSnapshot.error === 'unsupported-schema' && !malformedSnapshot.tournament,
          'a v3 session without a decodable format fails closed');
        const classicRepo = createInMemoryTournamentRepository({ uid: 'owner-4', now: () => 4000 });
        const classicCreated = await classicRepo.createSession(tournamentFixture());
        let classicSnapshot;
        classicRepo.watchSession(classicCreated.sessionId, value => { classicSnapshot = value; });
        assert(classicSnapshot.schemaVersion === 2 && classicSnapshot.tournament.format === null,
          'a classic tournament (no format) still creates a byte-identical schema-v2 session');
      } catch (error) {
        assert(false, 'repository suite completes without an unexpected error', error && error.message);
      }
      const total = passed + failed;
      const summary = document.createElement('div');
      summary.id = 'summary';
      summary.className = 'summary ' + (failed ? 'summary--fail' : 'summary--pass');
      summary.dataset.passed = String(passed);
      summary.dataset.failed = String(failed);
      summary.textContent = passed + '/' + total + ' tests passed' + (failed ? ' — ' + failed + ' FAILED' : ' — ALL PASSED');
      out.appendChild(summary);
      document.documentElement.dataset.status = failed ? 'failed' : 'passed';
    })();
  </script>
</body>
</html>
