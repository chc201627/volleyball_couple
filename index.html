<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Beach Volleyball Couple Matching</title>
  <meta name="description" content="Randomly match beach volleyball players into couples with gender-balanced pairing.">

  <!-- The redesigned entry point. Lives alongside index.html for the whole slice chain so every
       step stays runnable and comparable against the current UI; slice L
       promotes it to index.html and deletes the v1 assets. -->
  <link rel="stylesheet" href="css/design-tokens.css?v=2.0.0">
  <link rel="stylesheet" href="css/reset.css?v=2.0.0">
  <link rel="stylesheet" href="css/app-shell.css?v=2.0.0">
  <link rel="stylesheet" href="css/animations.css?v=2.0.0">
  <link rel="stylesheet" href="css/ui-components.css?v=2.0.0">
</head>
<body>
  <!-- Only the active screen is ever in the DOM. There are no hidden siblings
       to keep in sync, which is why this shell carries no [hidden] override. -->
  <div class="app">
    <div id="app-bar"></div>
    <main class="app__main" id="app-main"></main>
    <div class="app__tab-bar" id="app-tabbar"></div>
  </div>
  <div class="app__overlay" id="app-overlay"></div>

  <!-- Firebase Realtime Database (compat SDK v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Script order is contractual: domain modules, then the UI layer, then the
       orchestrator. Every local asset carries ?v= — use scripts/bump-version.js
       rather than editing them by hand. -->
  <script src="js/firebase-config.js?v=2.0.0"></script>

  <script src="js/pairing.js?v=2.0.0"></script>
  <script src="js/player-import.js?v=2.0.0"></script>
  <script src="js/i18n.js?v=2.0.0"></script>
  <script src="js/tournament.js?v=2.0.0"></script>
  <script src="js/tournament-format.js?v=2.0.0"></script>
  <script src="js/tournament-day-selectors.js?v=2.0.0"></script>
  <script src="js/tournament-repository.js?v=2.0.0"></script>
  <script src="js/king-of-court.js?v=2.0.0"></script>
  <script src="js/workspace-view-machine.js?v=2.0.0"></script>
  <script src="js/app-state.js?v=2.0.0"></script>

  <script src="js/ui/dom-helpers.js?v=2.0.0"></script>
  <script src="js/ui/icon-registry.js?v=2.0.0"></script>
  <script src="js/ui/ui-components.js?v=2.0.0"></script>
  <script src="js/ui/screen-registry.js?v=2.0.0"></script>
  <script src="js/ui/screens/setup.js?v=2.0.0"></script>

  <script src="js/app-orchestrator.js?v=2.0.0"></script>
</body>
</html>
